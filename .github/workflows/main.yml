name: Build Android APK

on:
  push:
    branches: [ "main", "master", "phase-7-professional-export-rendering", "phase-8-final-integration-v2" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Phase 8 Integration, Build and Tests
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Djava.awt.headless=true -Dfile.encoding=UTF-8 -Dorg.gradle.jvmargs=-Xmx4096m"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Auto Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Prepare Gradle project
        run: |
          touch .env.example .env
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "gradlew" ]; then gradle wrapper; fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare CI release signing key
        run: |
          keytool -genkeypair -v -keystore ci-release.jks -storepass android -keypass android \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Ah Studio CI,O=Ah Studio,C=US"

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/ci-release.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 1

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-release-apk
          path: "**/build/outputs/apk/release/*.apk"
          retention-days: 1
